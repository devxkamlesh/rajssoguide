173.0 97.0 L 176.0 95.0 L 178.0 95.0 L 184.0 92.0 L 187.0 89.0 L 191.0 87.0 L 193.0 87.0 L 196.0 84.0 L 195.0 81.0 L 193.0 81.0 L 192.0 83.0 L 189.0 83.0 L 185.0 82.0 L 183.0 83.0 L 181.0 85.0 L 177.0 84.0 L 182.0 80.0 L 184.0 80.0 L 181.0 76.0 L 182.0 74.0 L 182.0 72.0 L 180.0 70.0 L 178.0 70.0 L 175.0 68.0 L 174.0 63.0 L 175.0 61.0 L 174.0 59.0 L 168.0 62.0 L 166.0 60.0 L 166.0 51.0 L 165.0 49.0 L 161.0 53.0 L 158.0 55.0 L 154.0 52.0 L 150.0 54.0 L 150.0 58.0 L 147.0 59.0 L 144.0 57.0 L 146.0 51.0 L 146.0 49.0 L 145.0 47.0 L 143.0 45.0 L 140.0 44.0 L 135.0 38.0 L 134.0 36.0 L 134.0 29.0 L 131.0 26.0 L 131.0 23.0 L 125.0 23.0 L 122.0 22.0 L 120.0 20.0 L 117.0 20.0 L 115.0 21.0 L 113.0 19.0 L 114.0 10.0 L 112.0 6.0 L 110.0 4.0 L 98.0 3.0 Z" fill="url(#rajGrad)" filter="url(#mapShadow)"/>

    <!-- Official Ashoka Lion Capital (State Emblem of India) -->
    <g transform="translate(97, 28) scale(0.36)" fill="#784108">
      <!-- Center Lion Face & Mane -->
      <path d="M-5,-38 C-8,-38 -10,-35 -10,-31 C-10,-28 -8,-25 -8,-22 C-8,-17 -5,-13 0,-13 C5,-13 8,-17 8,-22 C8,-25 10,-28 10,-31 C10,-35 8,-38 5,-38 C3,-38 2,-36 0,-36 C-2,-36 -3,-38 -5,-38 Z"/>
      <ellipse cx="0" cy="-24" rx="2.5" ry="3.5" fill="#FFD626"/>
      <polygon points="-2.5,-21 2.5,-21 0,-18" fill="#784108"/>

      <!-- Left Lion (Profile) -->
      <path d="M-8,-26 C-12,-32 -18,-30 -22,-24 C-24,-20 -23,-15 -18,-13 C-15,-12 -12,-11 -8,-10 Z"/>
      <circle cx="-16" cy="-21" r="1.5" fill="#FFD626"/>

      <!-- Right Lion (Profile) -->
      <path d="M8,-26 C12,-32 18,-30 22,-24 C24,-20 23,-15 18,-13 C15,-12 12,-11 8,-10 Z"/>
      <circle cx="16" cy="-21" r="1.5" fill="#FFD626"/>

      <!-- Combined Majestic Mane Body -->
      <path d="M-17,-12 C-18,-5 -15,0 -12,4 L12,4 C15,0 18,-5 17,-12 Z"/>
      
      <!-- Three Pillars / Front Paws -->
      <rect x="-13" y="4" width="6" height="11" rx="1.5"/>
      <rect x="-3" y="4" width="6" height="11" rx="1.5"/>
      <rect x="7" y="4" width="6" height="11" rx="1.5"/>

      <!-- Abacus Base Plate -->
      <rect x="-25" y="15" width="50" height="6.5" rx="2"/>
      
      <!-- Ashoka Chakra wheel in abacus -->
      <circle cx="0" cy="18.2" r="3.2" fill="#FFD626"/>
      <circle cx="0" cy="18.2" r="1.4" fill="#784108"/>

      <!-- Galloping Horse (left) & Bull (right) silhouettes on abacus -->
      <ellipse cx="-14" cy="18.2" rx="3.5" ry="1.8" fill="#FFD626"/>
      <ellipse cx="14" cy="18.2" rx="3.5" ry="1.8" fill="#FFD626"/>

      <!-- Bell-shaped Inverted Lotus Base -->
      <path d="M-21,21.5 L21,21.5 C24,26 23,28 20,29 L-20,29 C-23,28 -24,26 -21,21.5 Z"/>

      <!-- Satyameva Jayate Inscription Plinth -->
      <rect x="-17" y="30.5" width="34" height="3" rx="1"/>
    </g>

    <!-- Trade Mark 'TM' -->
    <text x="165" y="29" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="8" 
          font-weight="900" 
          fill="#E89B15" 
          letter-spacing="0.5">TM</text>

    <!-- Single Sign On Key -->
    <g fill="#480D15" stroke="#480D15">
      <!-- Horizontal Shaft -->
      <rect x="23" y="91" width="112" height="5" rx="2" stroke-width="0"/>
      
      <!-- Left Bit / Ward (Notch) -->
      <rect x="25" y="95" width="4.5" height="4" rx="0.5" stroke-width="0"/>
      <rect x="33" y="95" width="4" height="2.5" rx="0.5" stroke-width="0"/>

      <!-- Collars -->
      <rect x="131" y="88.5" width="3.5" height="10" rx="1.5" stroke-width="0"/>
      <rect x="135.5" y="89.5" width="3" height="8" rx="1" stroke-width="0"/>

      <!-- Unified Trefoil Bow with 3 circular holes -->
      <g fill-rule="evenodd">
        <path d="
          M 146 72
          A 11.5 11.5 0 0 1 154.5 83
          A 11.5 11.5 0 0 1 169 93.5
          A 11.5 11.5 0 0 1 154.5 104
          A 11.5 11.5 0 0 1 146 115
          A 11.5 11.5 0 0 1 137.5 104
          A 11.5 11.5 0 0 1 138 83
          A 11.5 11.5 0 0 1 146 72 Z
          
          M 146 78
          A 5.5 5.5 0 1 0 146 89
          A 5.5 5.5 0 1 0 146 78 Z

          M 146 98
          A 5.5 5.5 0 1 0 146 109
          A 5.5 5.5 0 1 0 146 98 Z

          M 158 88
          A 5.5 5.5 0 1 0 158 99
          A 5.5 5.5 0 1 0 158 88 Z
        " stroke-width="0"/>
      </g>
    </g>

    <!-- Typography: "Rajasthan" -->
    <text x="76" y="86.5" 
